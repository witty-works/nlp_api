sonar.projectKey=witty-works_nlp_api
sonar.organization=witty-works

sonar.python.version=3.12
sonar.sources=app,bin
sonar.tests=tests
# The page script has no JS test harness; its behaviour is covered by the
# route tests and checked in the browser.
sonar.coverage.exclusions=**/bin/**,app/textarea/*.js
sonar.python.coverage.reportPaths=coverage.xml
# The "faulty LLM-supplied CLI arguments" rules (path traversal, command
# injection) treat every command-line argument as untrusted. The scripts in
# bin/ are operator tools: the paths and URLs they are given are the
# operator's own choice, on the operator's machine. Everything in app/, which
# serves requests, is still analysed with them.
sonar.issue.ignore.multicriteria=cliCommandInjection,cliPathTraversal,cliPathInjection
sonar.issue.ignore.multicriteria.cliCommandInjection.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.cliCommandInjection.resourceKey=bin/**
sonar.issue.ignore.multicriteria.cliPathTraversal.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cliPathTraversal.resourceKey=bin/**
sonar.issue.ignore.multicriteria.cliPathInjection.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.cliPathInjection.resourceKey=bin/**
