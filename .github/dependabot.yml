# Dependabot reads uv.lock. Security updates are switched on in the
# repository settings and open pull requests against the default branch,
# dev; the options below shape them and the weekly version updates.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only uv.lock: the ranges in pyproject.toml record decisions (spacy below
    # 3.9 for the pinned models, scikit-learn at the version the context
    # checker's heads were saved with) and change only by hand.
    versioning-strategy: lockfile-only
    # Version updates wait a week after a release, so a compromised or broken
    # release has time to be pulled before it is proposed here.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # Pinned with the context-checker model files (pyproject.toml); moves
      # only together with new models.
      - dependency-name: scikit-learn
    groups:
      # These compute the local context checker's verdicts. A pull request
      # that moves them triggers ethics question 1.15 (AGENTS.md): measure
      # the scores before and after and screen it as #1279 did.
      context-checker:
        applies-to: version-updates
        patterns:
          - torch
          - transformers
          - sentence-transformers
          - setfit
          - tokenizers
          - huggingface-hub
          - safetensors
      context-checker-security:
        applies-to: security-updates
        # The same list as context-checker.
        patterns:
          - torch
          - transformers
          - sentence-transformers
          - setfit
          - tokenizers
          - huggingface-hub
          - safetensors
      # Everything else in one weekly pull request, minor and patch only;
      # major versions come one pull request each.
      python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions the workflows in .github/workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # The base images, pinned by tag and digest in Dockerfile and
  # languagetool/Dockerfile. No cooldown: a new digest of the same tag is how
  # the base image's security fixes arrive. A new LanguageTool release changes
  # what is flagged: adjudicate the snapshot diff of its test run before
  # merging (ethics question 1.14, AGENTS.md).
  - package-ecosystem: docker
    directories:
      - /
      - /languagetool
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      # The Python version follows .python-version and requires-python and
      # moves by hand; only new digests of 3.12 are proposed.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
