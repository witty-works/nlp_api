name: release image

# Builds the Docker image for a release tag and publishes it to
# ghcr.io/witty-works/nlp_api. The image holds no deployment configuration -
# everything is environment at runtime - so one image serves every
# deployment; pin it there by digest. See docs/deployment-sizing.md.
#
# The test suite is not repeated here: main.yaml runs on the same push.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # A rebuild of an existing tag, e.g. after a base image security fix.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Torch and three lg models make a ~4 GB image, and the build needs the
      # layers twice over; the runner's free disk is not enough for that.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # gitignored; the Dockerfile copies it from the build context and fails
      # the build without it.
      - name: Caching FastText models
        id: cache-fasttext
        uses: actions/cache@v3
        env:
          cache-name: cache-fasttext
        with:
          path: ./training_data/lid.176.bin
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./training_data/lid.176.bin') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install FastText models
        if: steps.cache-fasttext.outputs.cache-hit != 'true'
        run: |
          wget -P training_data https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 3.0.1 and 3.0, plus latest for the newest release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REVISION=${{ github.sha }}

      - name: Digest
        run: |
          echo "### ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it by digest: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
