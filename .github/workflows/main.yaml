name: run tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: enabled

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel

      - name: Caching Dependencies
        id: cache-pipenv
        uses: actions/cache@v2
        env:
          cache-name: cache-pipenv
        with:
          path: ./.venv
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-

      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          pipenv install --deploy --dev --verbose
          pipenv run python -m spacy download en_core_web_sm
          pipenv run python -m spacy download de_core_news_sm

      - name: Caching FastText models
        id: cache-fasttext
        uses: actions/cache@v2
        env:
          cache-name: cache-fasttext
        with:
          path: ./training_data/lid.176.bin
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('./training_data/lid.176.bin') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-

      - name: Install FastText models
        if: steps.cache-fasttext.outputs.cache-hit != 'true'
        run: |
          wget -P training_data https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - name: Caching translations
        id: cache-po-files
        uses: actions/cache@v2
        env:
          cache-name: cache-po-files
        with:
          path: ./locales
          key: ${{ runner.os }}-po-files-${{ hashFiles('**/*.po') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-

      - name: Compile translation
        if: steps.cache-po-files.outputs.cache-hit != 'true'
        run: |
          pipenv run pybabel compile -d locales -l de_DE -f
          pipenv run pybabel compile -d locales -l en_US -f

      - name: Create files directory
        run: |
          mkdir files

      - name: Run test suite
        run: |
          export testing=True
          pipenv run pytest --cov-config .coveragerc --cov=app -vv
