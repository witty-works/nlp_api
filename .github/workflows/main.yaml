name: run tests

on: [push]

env:
  CONTEXT_CHECKER_URL: "https://setfit.westeurope.inference.ml.azure.com/score"
  CONTEXT_CHECKER_API_KEY: ${{ secrets.CONTEXT_CHECKER_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pdm"

      - name: Install pdm
        run: |
          python -m pip install --upgrade pdm wheel

      - name: Install dependencies
        run: |
          pdm install --deploy --dev --verbose
          pdm run python -m spacy download en_core_web_md
          pdm run python -m spacy download de_core_news_lg

      - name: Caching FastText models
        id: cache-fasttext
        uses: actions/cache@v3
        env:
          cache-name: cache-fasttext
        with:
          path: ./training_data/lid.176.bin
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./training_data/lid.176.bin') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install FastText models
        if: steps.cache-fasttext.outputs.cache-hit != 'true'
        run: |
          wget -P training_data https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - name: Compile translation
        run: |
          pdm run pybabel compile -d locales -l de_DE -f
          pdm run pybabel compile -d locales -l de_AT -f
          pdm run pybabel compile -d locales -l de_CH -f
          pdm run pybabel compile -d locales -l en_US -f
          pdm run pybabel compile -d locales -l en_GB -f

      #- if: startsWith(github.ref, 'refs/tags/') != true && github.ref != 'refs/heads/main'
      #  name: Use LT "dev" via .env file for anything but "main"
      #  run: |
      #    echo "LANGUAGETOOL_API=\"https://dev-54ta5gq-7jb67g2dz5epc.de-2.platformsh.site/v2\"" >> .env

      - name: Run test suite
        run: |
          export testing=True
          pdm run pytest --cov-config .coveragerc --cov=app -vv --cov-report=xml --cov-report=html

      - name: Override Coverage Source Path for Sonar
        run: |
          sed -i "s/<source>\/home\/runner\/work\/nlp_api\/nlp_api\/app<\/source>/<source>\/github\/workspace\/app<\/source>/g" /home/runner/work/nlp_api/nlp_api/coverage.xml
          sed -i "s/<source>\/home\/runner\/work\/nlp_api\/nlp_api\/bin<\/source>/<source>\/github\/workspace\/bin<\/source>/g" /home/runner/work/nlp_api/nlp_api/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
