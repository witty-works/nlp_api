name: build image

# Builds the Docker image for linux/amd64, as release-image.yaml does, but
# without pushing it, whenever something that decides how the image is built
# changes. The release build only runs on a version tag, after the merge, and
# publishes what it builds; this one tests the same build on the branch.
# The build itself checks that spacy imports and that torch is a CPU build.

on:
  push:
    branches: ["**"]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - bin/fetch_editor.py
      - bin/editor-pin.json
      - bin/install_spacy_models.py
      - bin/spacy-models.json
      - .github/workflows/image.yaml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # As in release-image.yaml: the build needs the layers twice over, more
      # than the runner's free disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # gitignored; the Dockerfile copies it from the build context and fails
      # the build without it.
      - name: Caching FastText models
        id: cache-fasttext
        uses: actions/cache@v3
        env:
          cache-name: cache-fasttext
        with:
          path: ./training_data/lid.176.bin
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./training_data/lid.176.bin') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Install FastText models
        if: steps.cache-fasttext.outputs.cache-hit != 'true'
        run: |
          wget -P training_data https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            GIT_REVISION=${{ github.sha }}
