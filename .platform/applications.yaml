- name: "app"

  type: "python:3.11"

  disk: 2048

  resources:
    base_memory: 1024
    memory_ratio: 1024

  container_profile: BALANCED

  dependencies:
    python3:
      pipenv: "2023.2.4"

  web:
    upstream:
      socket_family: unix
    commands:
      start: |
        blackfire-python gunicorn app.main:app -b unix:$SOCKET -w 1 --threads ${THREADS} -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"

  hooks:
    build: |
      set -e

      # cache pipenv
      PIPENV_CACHE_DIR=$PLATFORM_CACHE_DIR
      pipenv install --system --deploy

      pipenv run /opt/python/3.11/bin/python3.11 -m spacy download en_core_web_md --no-cache-dir
      pipenv run /opt/python/3.11/bin/python3.11 -m spacy download de_core_news_lg --no-cache-dir

      export FT_MODEL="lid.176.bin"

      if [ ! -f "${PLATFORM_CACHE_DIR}/$FT_MODEL" ]; then
        echo "Downloading ${FT_MODEL} ..."
        cd "${PLATFORM_CACHE_DIR}"
        curl https://dl.fbaipublicfiles.com/fasttext/supervised-models/${FT_MODEL} --output ${FT_MODEL}
        cd ~
      else
        echo "Using cached ${FT_MODEL} model ..."
      fi

      echo "Installing archive of ${FT_MODEL} from '${PLATFORM_CACHE_DIR}/${FT_MODEL}' ..."
      cp -R "${PLATFORM_CACHE_DIR}/${FT_MODEL}" ./training_data/.

      echo "e613bda316ecb4f5e1924140eedf81b81c087d9a *training_data/lid.176.bin" | sha1sum -c -
    post_deploy: |
      set -e

      ./start_workers.sh -t $THREADS -a $PLATFORM_APPLICATION

  relationships:
    rediscache: "rediscache:redis"
    de: "german:http"
    en: "english:http"

  crons:
    generate-statistics:
      spec: "0 1 * * 0"
      cmd: |
        if [ "$PLATFORM_BRANCH" = main ]; then
            ./statistics.sh
        fi
    analyze-rules:
      spec: "0 1 * * *"
      cmd: |
        if [ "$PLATFORM_BRANCH" = dev ]; then
            ./analyze_rules.sh
        fi

  mounts:
    "analyze_rules": "shared:files/analyze_rules"

- name: "english"

  variables:
    env:
      LANGS: '["en"]'
      LANGUAGE_ENDPOINT_ENABLED_EN: true

  type: "python:3.11"

  disk: 2048

  resources:
    base_memory: 1024
    memory_ratio: 1024

  container_profile: LOW_MEMORY

  dependencies:
    python3:
      pipenv: "2023.2.4"

  web:
    upstream:
      socket_family: unix
    commands:
      start: |
        blackfire-python gunicorn app.main:app -b unix:$SOCKET -w 1 --threads ${THREADS_EN} -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"

  hooks:
    build: |
      set -e

      # cache pipenv
      PIPENV_CACHE_DIR=$PLATFORM_CACHE_DIR
      pipenv install --system --deploy

      pipenv run /opt/python/3.11/bin/python3.11 -m spacy download en_core_web_md --no-cache-dir

      pipenv run pybabel compile -d locales -l en_US -f
      pipenv run pybabel compile -d locales -l en_GB -f
    post_deploy: |
      set -e

      ./start_workers.sh -t $THREADS_EN -a $PLATFORM_APPLICATION

