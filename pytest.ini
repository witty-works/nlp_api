[pytest]
log_level=DEBUG
asyncio_mode=strict
env =
    D:TESTING=True
    # The management endpoints are protected by default. The tests exercise what
    # those endpoints do rather than who may call them; test_management_auth
    # covers the guard itself by switching it back on.
    D:MANAGEMENT_AUTH_ENABLED=False
    # A deployment with no LLM_MODEL has no LLM at all, which would make every
    # test that exercises llm_alternatives assert the same thing. Naming one
    # here does not reach a provider — test_llm_* patch the call itself.
    D:LLM_MODEL=bedrock/test.model