name: "app"

type: "python:3.9"

disk: 4096

resources:
  base_memory: 1024
  memory_ratio: 1024

dependencies:
  python3:
    pipenv: "2021.5.29"

web:
  upstream:
    socket_family: unix
  commands:
    start: |
      gunicorn app.main:app -b unix:$SOCKET -w ${WORKERS} -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"
  locations:
    "/static":
      root: "static"
      rules:
        '\.(css|js|ico)$':
          expires: 10m

mounts:
  "logs":
    source: local
    source_path: logs
  "user_training_data":
    source: local
    source_path: user_training_data

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download en_core_web_sm --no-cache-dir
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download de_core_news_sm --no-cache-dir
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_US -f

    export FT_MODEL="lid.176.bin"

    if [ ! -f "$FT_MODEL" ]; then
      echo "Downloading ${FT_MODEL} ..."
      cd "${PLATFORM_CACHE_DIR}"
      curl https://dl.fbaipublicfiles.com/fasttext/supervised-models/${FT_MODEL} --output ${FT_MODEL}
      cd ~
    else
      echo "Using cached ${FT_MODEL} model ..."
    fi

    echo "Installing archive of ${FT_MODEL} from '${PLATFORM_CACHE_DIR}/${FT_MODEL}' ..."
    cp -R "${PLATFORM_CACHE_DIR}/${FT_MODEL}" ./training_data/.

relationships:
  languagetool: "languagetool:http"
  #rediscache: "cacheredis:redis"

crons:
  generate-statistics:
    spec: "55 0 * * *"
    cmd: |
      if [ "$PLATFORM_BRANCH" = main ]; then
          flock -n /tmp/send_statistics.lock php send_statistics.php
      fi
