name: "app"

type: "python:3.9"

disk: 12000

resources:
  base_memory: 1024
  memory_ratio: 1024

dependencies:
  python3:
    pipenv: "2021.5.29"

web:
  upstream:
    socket_family: unix
  commands:
    start: |
      WORKERS="$(jq ".info.limits.memory / 250 | tonumber | floor" /run/config.json)"
      gunicorn app.main:app -b unix:$SOCKET -w ${WORKERS} -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"
  locations:
    "/static":
      root: "static"
      rules:
        '\.(css|js|ico)$':
          expires: 10m

mounts:
  "logs":
    source: local
    source_path: logs
  "user_training_data":
    source: local
    source_path: user_training_data

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download en_core_web_sm --no-cache-dir
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download de_core_news_sm --no-cache-dir
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_US -f

relationships:
  languagetool: "languagetool:http"
  #rediscache: "cacheredis:redis"

crons:
  generate-statistics:
    spec: "55 0 * * *"
    cmd: |
      if [ "$PLATFORM_BRANCH" = main ]; then
          flock -n /tmp/send_statistics.lock php send_statistics.php
      fi
