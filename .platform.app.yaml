name: "app"

type: "python:3.9"

disk: 3072

resources:
  base_memory: 1024
  memory_ratio: 1024

dependencies:
  python3:
    pipenv: "2021.5.29"

web:
  upstream:
    socket_family: unix
  commands:
    start: |
      [ $PLATFORM_ENVIRONMENT_TYPE == "development" ] && WORKERS="6" || WORKERS="$(jq ".info.limits.memory / 250 | tonumber | floor" /run/config.json)"
      blackfire-python gunicorn app.main:app -b unix:$SOCKET -w ${WORKERS} -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"
  locations:
    "/":
      root: "favicon"
      rules:
        '\.ico$':
          expires: 3600m
      passthru: true
    "/static":
      root: "static"
      rules:
        '\.(css|js|ico)$':
          expires: 10m

mounts:
  "logs":
    source: local
    source_path: logs

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pipenv run /opt/python/3.9/bin/python3.9 -m pip install blackfire==1.8.0
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download en_core_web_sm
    pipenv run /opt/python/3.9/bin/python3.9 -m spacy download de_core_news_sm
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_GB -f
    mkdir 'favicon'
    cp static/favicon.ico favicon/favicon.ico

relationships:
  languagetool: "languagetool:http"
  rediscache: "cacheredis:redis"

variables:
  env:
    BLACKFIRE_AGENT_SOCKET: "unix:///run/blackfire.sock"
    BLACKFIRE_LOG_FILE: "/tmp/blackfire.log"
