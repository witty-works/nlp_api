name: 'app'

type: 'python:3.8'

dependencies:
  python3:
    pipenv: '2018.10.13'
    supervisor: '*'

web:
  upstream:
    socket_family: unix
  commands:
    start: "supervisord -n -c supervisord.conf"
  locations:
    '/':
      passthru: true

mounts:
  'files':
    source: local
    source_path: files

disk: 4096

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pip install ./blackfire-1.6.1-cp38-cp38-linux_x86_64.whl --force-reinstall
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download en_core_web_sm
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download de_core_news_sm
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_GB -f

size: L
resources:
  base_memory: 1024
  memory_ratio: 1024
