name: 'app'

type: 'python:3.8'

dependencies:
  python3:
    pipenv: '2021.5.29'
    supervisor: '*'

web:
  upstream:
    socket_family: unix
  commands:
    start: "supervisord -n -c supervisord.conf"
  locations:
    '/':
      passthru: true

mounts:
  'files':
    source: local
    source_path: files
  'logs':
    source: local
    source_path: logs
  'languagetool-server':
    source: local
    source_path: 'languagetool-server'

disk: 4096

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pip install ./blackfire-1.6.1-cp38-cp38-linux_x86_64.whl --force-reinstall
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download en_core_web_sm
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download de_core_news_sm
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_GB -f
  deploy: |
    set -e
    export DIR="languagetool-server"
    export SERVER="${DIR}.jar"
    export LT="LanguageTool-5.4"
    if [ ! -f "${DIR}/${LT}/${SERVER}" ]; then
      export FILE="${DIR}/${LT}.zip"
      [ ! -f "$FILE" ] && wget -P "${DIR}" https://languagetool.org/download/${LT}.zip
      [ ! -f "${DIR}/$LT" ] && unzip $FILE -d "${DIR}"
      rm -rf "${FILE}"
    fi

size: L
resources:
  base_memory: 1024
  memory_ratio: 1024
