name: 'app'

type: 'python:3.8'

dependencies:
  python3:
    pipenv: '2021.5.29'

web:
  upstream:
    socket_family: unix
  commands:
    start: 'gunicorn app.main:app -b unix:$SOCKET -w 12 -k uvicorn.workers.UvicornWorker --forwarded-allow-ips="*"''
  locations:
    '/':
      passthru: true

mounts:
  'files':
    source: local
    source_path: files
  'logs':
    source: local
    source_path: logs

disk: 4096

hooks:
  build: |
    set -e
    pipenv install --system --deploy
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download en_core_web_sm
    pipenv run /opt/python/3.8/bin/python3.8 -m spacy download de_core_news_sm
    pipenv run pybabel compile -d locales -l de_DE -f
    pipenv run pybabel compile -d locales -l en_GB -f

size: L
resources:
  base_memory: 1024
  memory_ratio: 1024

source:
    root: languagetool

relationships:
  languagetool: "languagetool:http"