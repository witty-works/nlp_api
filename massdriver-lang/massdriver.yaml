schema: draft-07
name: nlp-api-lang
description: Language specific NLP API (receives internal requests, applies language rules, check LanguageTool)
source_url: github.com/witty-works/nlp_api
access: private
type: application

app:
  envs:
    LANGUAGETOOL_API: .connections.languagetool_api.data.api.hostname
    LANGS: .params.configuration.app.languages
    LANGUAGE_ENDPOINT_ENABLED_DE: .params.configuration.app.languages | index("de") != null
    LANGUAGE_ENDPOINT_ENABLED_EN: .params.configuration.app.languages | index("en") != null
    API_DOCS_USERNAME: .params.configuration.api_docs.username
    API_DOCS_AUTH_ENABLED: .params.configuration.api_docs.auth_enabled
    CONTEXT_CHECKER_URL: .params.configuration.context_checker.url
    SENTRY_SAMPLE_RATE: .params.configuration.sentry.sample_rate
    SENTRY_TRACES_SAMPLE_RATE: .params.configuration.sentry.traces_sample_rate
    LOGGING_ENABLED: .params.configuration.logging.enabled
    LOGGING_CONFIG_FILENAME: .params.configuration.logging.filename
  policies: []
  secrets:
    API_DOCS_PASSWORD:
      required: false
      title: "API doc password"
      description: "fetch from portal.azure.com vault, sync with dashboard.witty.works"
    SENTRY_DSN:
      required: true
      title: "Sentry DSN"
      description: "fetch from sentry.io"
    CONTEXT_CHECKER_API_KEY:
      required: true
      title: "Context Checker API key"
      description: "fetch from ml.azure.com "

params:
  required:
    - namespace
    - image
    - resourceRequests
    - replicas
    - ingress
  properties:
    namespace:
      title: Kubernetes Namespace
      description: Application will be deployed into this namespace. If the namespace doesn't exist, it will be created.
      $ref: https://raw.githubusercontent.com/massdriver-cloud/artifact-definitions/main/definitions/types/k8s-resource-name.json
      default: default
    image:
      title: Container Image
      type: object
      required:
        - repository
        - tag
      properties:
        repository:
          $md.immutable: true
          title: Repository
          # Massdriver automatically configures your Kubernetes clusters to have access to your cloud container repositories.
          # Just set the full URI here or remove this field and hard code it in your values.yaml file.
          description: Container repository to use for this application.
          type: string
        tag:
          title: Image Tag
          $ref: https://raw.githubusercontent.com/massdriver-cloud/artifact-definitions/main/definitions/types/docker-image-tag.json
          default: latest
    command:
      title: Command
      description: Command to execute as the entrypoint of the container. If left unspecified, the container default will be used (referred to as 'entrypoint' in some container runtimes, such as Docker). Formatted as an array of strings so that 'exec' form is used.
      type: array
      items:
        type: string
    args:
      title: Arguments
      description: Arguments to pass to the entrypoint command of the container. If left unspecified, the container default will be used (referred to as 'command' in some container runtimes, such as Docker). Formatted as an array of strings so that 'exec' form is used.
      type: array
      items:
        type: string
    resourceRequests:
      title: Resources
      type: object
      required:
        - cpu
        - memory
      properties:
        cpu:
          title: CPU Cores
          description: The expected CPU cores required for this application. Fractional numbers are allowed (0.5 is one half of a CPU core).
          type: number
          minimum: 0.001
        memory:
          title: Memory
          description: The expected Memory resources required for this application.
          type: integer
    port:
      title: Port
      description: The container port the application will listen on.
      $ref: https://raw.githubusercontent.com/massdriver-cloud/artifact-definitions/main/definitions/types/port.json
    replicas:
      title: Replicas
      description: Manage the number of concurrent replicas of your application
      type: object
      properties:
        autoscalingEnabled:
          title: Enable Horizontal Pod Autoscaling
          description: A Horizontal Pod Autoscaler will enable your application to automatically add or remove replicas based on resource utilization.
          type: boolean
          default: false
      dependencies:
        autoscalingEnabled:
          oneOf:
            - properties:
                autoscalingEnabled:
                  const: false
                replicaCount:
                  title: Number of Replicas
                  description: Fixed number of replicas to constantly maintain
                  type: integer
                  minimum: 1
                  default: 1
              required:
                - replicaCount
            - properties:
                autoscalingEnabled:
                  const: true
                minReplicas:
                  title: Minimum Replicas
                  description: Minimum number of replicas the autoscaler will maintain, based on target resource utilization
                  type: integer
                  minimum: 1
                  default: 1
                maxReplicas:
                  title: Maximum Replicas
                  description: Maximum number of replicas the autoscaler will provision, based on target resource utilization
                  type: integer
                  minimum: 1
                  default: 10
                targetCPUUtilizationPercentage:
                  title: Target CPU Utilization Percentage
                  description: The percentage of allocated CPU resources the autoscaler should target, based on the values specified in the 'Resources' section. If utilization rises sufficiently above this percentage, replicas will be added. If utilization drops sufficiently below this percentage, replicas will be removed.
                  type: integer
                  minimum: 1
                  default: 80
              required:
                - minReplicas
                - maxReplicas
                - targetCPUUtilizationPercentage
    ingress:
      title: Ingress
      description: Configure the application for public internet accessibility
      type: object
      properties:
        enabled:
          title: Enable Public Internet Access
          type: boolean
          default: false
      dependencies:
        enabled:
          oneOf:
            - properties:
                enabled:
                  const: false
            - properties:
                enabled:
                  const: true
                host:
                  title: HTTP Hostname
                  description: The hostname which this application should be accessable on, such as www.example.com. You must own this domain and have it associated with this kubernetes cluster if you would like automatic DNS record and SSL certificate management.
                  type: string
                  pattern: ^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]*[a-zA-Z0-9])\.)*([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9])$
                  message:
                    pattern: Hostname should consist of letters, numbers, periods and hyphens, such as www.example.com
                path:
                  title: HTTP Path
                  description: The HTTP path which, when appended to the host above, this application will serve traffic on
                  type: string
                  default: "/"
                  pattern: ^\/.*$
                  message:
                    pattern: Must begin with a '/' and be a valid HTTP endpoint
              required:
                - host
                - path
    configuration:
      title: Configuration
      description: Application specific configuration settings
      type: object
      properties:
        api_docs:
          title: API Docs
          description: API Docs
          type: object
          properties:
            username:
              type: string
            auth_enabled:
              type: boolean
        context_checker:
          title: Context Checker
          description: Context Checker
          type: object
          properties:
            url:
              type: string
        sentry:
          title: Sentry
          description: Sentry
          type: object
          properties:
            sample_rate:
              type: number
            traces_sample_rate:
              type: number
        app:
          title: App Settings
          description: App Settings
          type: object
          properties:
            languages:
              title: Languages
              description: JSON encoded array of languages enabled on this instance
              type: string
        logging:
          title: Logging
          description: Logging
          type: object
          properties:
            enabled:
              type: boolean
            filename:
              type: string

connections:
  required:
    - kubernetes_cluster
    - languagetool_api
  properties:
    kubernetes_cluster:
      $ref: massdriver/kubernetes-cluster
    aws_authentication:
      $ref: massdriver/aws-iam-role
    gcp_authentication:
      $ref: massdriver/gcp-service-account
    azure_authentication:
      $ref: massdriver/azure-service-principal
    languagetool_api:
      $ref: massdriver/api

artifacts:
  required:
    - internal
  properties:
    internal:
      $ref: massdriver/api

ui:
  ui:order:
    - namespace
    - image
    - command
    - args
    - resourceRequests
    - replicas
    - port
    - ingress
    - "*"
  resourceRequests:
    memory:
      ui:field: conversionFieldData
      unit: Bytes
  replicas:
    ui:order:
      - autoscalingEnabled
      - replicaCount
      - minReplicas
      - maxReplicas
      - targetCPUUtilizationPercentage
      - "*"
  ingress:
    ui:order:
      - enabled
      - host
      - path
      - "*"
