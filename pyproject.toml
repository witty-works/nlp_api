[project]
name = "witty-works"
version = "3.1.2"
description = ""
authors = [
    {name = "Lukas Kahwe Smith", email = "lukas.smith@witty.works"},
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic<3.0.0,>=2.0.0",
    "pydantic-settings>=2.0.3",
    "uvicorn[standard]",
    "gunicorn",
    # Bounded to the range the pinned models below declare, so spacy cannot
    # float to a version they were never built against.
    "spacy>=3.8.14,<3.9.0",
    # Floor, not ceiling: fasttext-predict has no numpy coupling, so numpy 1
    # would resolve silently if something else preferred it.
    "numpy>=2.0",
    "pandas",
    "aiofiles",
    "aiohttp",
    # Renders a deployment's imprint (TEXTAREA_IMPRINT_FILE) for /textarea.
    "markdown-it-py>=4.0.0",
    "sentry-sdk",
    "redis",
    "fakeredis",
    # Inference-only fastText build (SearXNG-maintained), no numpy dependency;
    # Meta archived fastText upstream in 2024. See docs/spacy-review.md.
    "fasttext-predict",
    "slack-bolt",
    "german-nouns",
    "inflex",
    "spacy-lookups-data",
    # The spaCy models are not listed here: they are wheels on GitHub release
    # pages, which Dependabot cannot resolve. They are pinned by hash in
    # bin/spacy-models.json and installed by bin/install_spacy_models.py.
    "secure>=0.3.0",
    "spacymoji>=3.0.1",
    "emoji>=0.6.0",
    "cmp-version>=3.0.0",
    # The local context checker (app/context_checker.py). 1.2 is the first
    # release that runs on transformers 5.
    "setfit>=1.2.0",
    # The classifier head of each context-checker model (model_head.pkl) was
    # saved with scikit-learn 1.7.2, and scikit-learn does not guarantee the
    # same results when it loads a model saved by another version. Move it
    # only together with new model files.
    "scikit-learn==1.7.2",
    # Through setfit; listed so it comes from the PyTorch CPU index (see
    # [tool.uv.sources]): the image runs on CPU, and PyPI's Linux build brings
    # the CUDA libraries.
    "torch>=2.15.0",
    "eng>=0.1.1",
    "aiosqlite>=0.19.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.2",
    "boto3>=1.34.130",
    "json-repair>=0.28.3",
    "litellm>=1.60.0",
    "pluralizefr>=0.0.1",
    "python-multipart>=0.0.32",
    # The API key file (app/api_keys.py).
    "pyyaml>=6.0",
    # Minimum client versions (app/version_validators.py).
    "packaging>=22.0",
]
requires-python = ">=3.12,<3.15"
license = "MIT"

[dependency-groups]
# Blackfire: continuous profiling (BLACKFIRE_ENABLE_CONTINUOUS_PROFILING) and
# blackfire-python locally. Not in the image: its profiler pins ddtrace, which
# brings opentelemetry and protobuf.
profiling = [
    "blackfire",
    "blackfire-conprof>=1.0.0",
]
dev = [
    "click",
    "polib",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    "black",
    "pytest-asyncio",
    "pytest-snapshot",
    "pytest-env>=0.8.1",
    # The test client; Starlette deprecates httpx for it.
    "httpx2>=2.0.0",
]

[tool.uv]
# german-nouns requires wiktionary-de-parser, which pins lxml<5 (with known
# vulnerabilities). The app only uses german_nouns.lookup, which reads the
# bundled noun list; the parser is only needed to rebuild that list from a
# Wiktionary dump (german_nouns.parse_dump).
exclude-dependencies = ["wiktionary-de-parser"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only for what [tool.uv.sources] sends there; everything else from PyPI.
explicit = true
