[tool.pdm]
[[tool.pdm.source]]
url = "https://pypi.org/simple"
verify_ssl = true
name = "pypi"

[tool.pdm.dev-dependencies]
dev = [
    "click",
    "polib",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    "black",
    "opencensus-ext-azure",
    "pytest-asyncio",
    "pytest-snapshot",
    "eng>=0.1.1",
]

[project]
name = "witty-works"
version = ""
description = ""
authors = [
    {name = "Lukas Kahwe Smith", email = "lukas.smith@witty.works"},
]
dependencies = ["fastapi<0.91.0,>=0.90.0", "pydantic<2.0.0,>=1.2.0", "uvicorn[standard]", "gunicorn", "spacy", "pandas", "aiofiles", "babel", "aiohttp", "sentry-sdk", "opencensus-ext-azure", "redis", "platformshconfig", "fakeredis", "fasttext", "fastapi-microsoft-identity", "slack-bolt", "german-nouns", "inflex", "blackfire", "spacy-lookups-data"]
requires-python = ">=3.11"
license = "Proprietary"

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"
