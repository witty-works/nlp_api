[tool.pdm]
[[tool.pdm.source]]
url = "https://pypi.org/simple"
verify_ssl = true
name = "pypi"

[[tool.pdm.source]]
type = "find_links"
url = "https://download.pytorch.org/whl/cpu/torch_stable.html"
name = "torch"

[tool.pdm.dev-dependencies]
dev = [
    "click",
    "polib",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    "black",
    "pytest-asyncio",
    "pytest-snapshot",
    "pytest-env>=0.8.1",
    "httpx>=0.25.0",
]

[project]
name = "witty-works"
version = "2.0"
description = ""
authors = [
    {name = "Lukas Kahwe Smith", email = "lukas.smith@witty.works"},
]
dependencies = [
    "fastapi<0.116.0,>=0.115.0",
    "pydantic<3.0.0,>=2.0.0",
    "pydantic-settings>=2.0.3",
    "uvicorn[standard]",
    "gunicorn",
    # Bounded to the range the pinned models below declare, so spacy cannot
    # float to a version they were never built against.
    "spacy>=3.8.2,<3.9.0",
    # Floor, not ceiling: fasttext-predict has no numpy coupling, so numpy 1
    # would resolve silently if something else preferred it.
    "numpy>=2.0",
    "pandas",
    "aiofiles",
    "aiohttp",
    "sentry-sdk",
    "redis",
    "platformshconfig",
    "fakeredis",
    # Inference-only fastText build (SearXNG-maintained), no numpy dependency;
    # Meta archived fastText upstream in 2024. See docs/spacy-review.md.
    "fasttext-predict",
    "slack-bolt",
    "german-nouns",
    "inflex",
    "spacy-lookups-data",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "de-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
    "fr-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl",
    "secure>=0.3.0",
    "spacymoji>=3.0.1",
    "emoji>=0.6.0",
    "cmp-version>=3.0.0",
    "setfit>=0.7.0",
    "eng>=0.1.1",
    "blackfire",
    "blackfire-conprof>=1.0.0",
    "aiosqlite>=0.19.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.2",
    "boto3>=1.34.130",
    "json-repair>=0.28.3",
    "litellm>=1.60.0",
    "pluralizefr>=0.0.1",
    "python-multipart>=0.0.32",
]
requires-python = ">3.12"
license = "Proprietary"

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"
