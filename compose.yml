version: "3.9"

services:
  languagetool:
    # Pinned: the cloud API moved from 6.8 to 6.9-SNAPSHOT and stopped
    # reporting COMMA_COMPOUND_SENTENCE, which changed test output with no
    # change here. latest would drift the same way.
    image: erikvl87/languagetool:6.8
    container_name: lt
    ports:
      # Host side deliberately not 8010: that is a common default and a local
      # PHP server on ::1 shadowed it, so localhost resolved past the container.
      - "8210:8010"
    environment:
      # The default heap runs out part way through the test suite:
      # java.lang.OutOfMemoryError: Java heap space, and the container exits.
      - Java_Xms=512m
      - Java_Xmx=4g

  nlpapi:
    build:
      context: .
      args:
        # Bake the served revision into the image so /version can report it:
        # export GIT_REVISION=$(git rev-parse HEAD) before `docker compose build`.
        - GIT_REVISION=${GIT_REVISION:-}
    container_name: nlp_api
    depends_on:
      - languagetool
    ports:
      # Container side is 8081: that is where the Dockerfile CMD binds gunicorn.
      - "8080:8081"
    environment:
      # Point API to LanguageTool service
      - LANGUAGETOOL_API=http://languagetool:8010/v2
      # Enable local SetFit models if present in ./models
      # - CONTEXT_CHECKER_LOCAL=true
    volumes:
      # The image does not COPY the rule database; the app reads
      # ./database/dump.sql (or db.sqlite3) relative to /code at startup.
      - ./database:/code/database
      # Mount local models folder if you want to use local SetFit models
      - ./models:/code/models:ro
    # If you prefer rebuilding on changes in local dev, uncomment next line
    # develop:
    #   watch:
    #     - path: .
    #       action: sync
    #       target: /app

networks:
  default:
    name: nlp-net
